volumes:
  postgres_data:
    driver: local

services:
  postgres:
    image: postgres
    environment:
      POSTGRES_DB: testkeycloakdb
      POSTGRES_USER: testkeycloakuser
      POSTGRES_PASSWORD: testkeycloakpassword
    restart:
      always

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: testkeycloakdb
      KC_DB_USERNAME: testkeycloakuser
      KC_DB_PASSWORD: testkeycloakpassword
      # Keycloak 17+ (Quarkus) serves at the root path by default; keep the legacy /auth
      # prefix so server_url="http://.../auth" in tests/docs/examples keeps working.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloakuser
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloakpassword
      KC_HEALTH_ENABLED: "true"
    ports:
      - '8085:8080'
    depends_on:
      - postgres
    restart:
      always
